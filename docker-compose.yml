# =============================================================================
# BugDNA — local development stack
# =============================================================================
# One command to a working system:
#
#     cp .env.example .env
#     docker compose up --build
#
# Then:  web http://localhost:3000   api http://localhost:4000
#        risk service http://localhost:8000/docs
#
# On first boot the risk service trains a bootstrap model (synthetic data,
# clearly labelled as such), so predictions come from real XGBoost inference with
# real SHAP attributions rather than the heuristic fallback.
#
# For the production topology see docker-compose.prod.yml.
# =============================================================================

name: bugdna

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — system of record
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bugdna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugdna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugdna_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-bugdna}
      # Faster and safer collation behaviour for a fresh cluster.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `pg_isready` alone returns true before the database accepts queries, so
      # the check names the database explicitly.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugdna} -d ${POSTGRES_DB:-bugdna}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [bugdna]

  # ---------------------------------------------------------------------------
  # Redis — cache, transient analysis state, BullMQ
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bugdna-redis
    restart: unless-stopped
    # `appendonly` so a restart does not drop queued jobs mid-development.
    # Redis is still never the source of truth (see docs/Architecture.md).
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [bugdna]

  # ---------------------------------------------------------------------------
  # Python risk service — XGBoost + SHAP
  # ---------------------------------------------------------------------------
  ml-service:
    build:
      # Root context so the shared feature contract in contracts/ is available.
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: bugdna-ml
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      ML_PORT: 8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      MODEL_DIR: /app/models
      CONTRACTS_DIR: /app/contracts
      MODEL_NAME: ${MODEL_NAME:-bugdna-risk}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
      ALLOW_HEURISTIC_FALLBACK: ${ALLOW_HEURISTIC_FALLBACK:-true}
      SHAP_MAX_FEATURES_RETURNED: ${SHAP_MAX_FEATURES_RETURNED:-12}
      # Train a bootstrap model on first boot so the demo shows real SHAP output.
      BOOTSTRAP_MODEL_ON_START: ${BOOTSTRAP_MODEL_ON_START:-true}
      BOOTSTRAP_ROWS: ${BOOTSTRAP_ROWS:-12000}
    ports:
      # Exposed for local inspection of /docs. In production this port is not
      # published — the service is reachable only on the internal network.
      - "${ML_PORT:-8000}:8000"
    volumes:
      # Persist the trained artifact so it is not retrained on every restart.
      - ml-models:/app/models
      # Live-reload the contract during development without a rebuild.
      - ./contracts:/app/contracts:ro
    networks: [bugdna]

  # ---------------------------------------------------------------------------
  # API — Express + Prisma + Socket.io
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugdna-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}

      # Service names, not localhost: these resolve on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-bugdna}:${POSTGRES_PASSWORD:-bugdna_local_password}@postgres:5432/${POSTGRES_DB:-bugdna}?schema=public
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_NAME: ${COOKIE_NAME:-bugdna_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}

      GITHUB_MODE: ${GITHUB_MODE:-live}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:4000/api/v1/auth/github/callback}
      GITHUB_OAUTH_SCOPES: ${GITHUB_OAUTH_SCOPES:-read:user,user:email,repo}
      GITHUB_MAX_FILES_PER_PR: ${GITHUB_MAX_FILES_PER_PR:-300}
      GITHUB_MAX_PATCH_BYTES: ${GITHUB_MAX_PATCH_BYTES:-120000}

      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ML_REQUEST_TIMEOUT_MS: ${ML_REQUEST_TIMEOUT_MS:-20000}

      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-4}
      HIGH_RISK_NOTIFY_THRESHOLD: ${HIGH_RISK_NOTIFY_THRESHOLD:-70}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-true}
      SEED_DEMO_LOGIN: ${SEED_DEMO_LOGIN:-bugdna-demo}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@bugdna.dev}
    ports:
      - "${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not `service_healthy`: the risk service trains a bootstrap model on first
      # boot, and the API is perfectly usable while that happens. Analyses queue
      # and retry until it answers.
      ml-service:
        condition: service_started
    # Apply migrations before serving. `migrate deploy` is idempotent and is the
    # correct command for a non-interactive environment (unlike `migrate dev`).
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    networks: [bugdna]

  # ---------------------------------------------------------------------------
  # Worker — runs the analysis pipeline
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bugdna-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bugdna}:${POSTGRES_PASSWORD:-bugdna_local_password}@postgres:5432/${POSTGRES_DB:-bugdna}?schema=public
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_URL: ${API_URL:-http://localhost:4000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      GITHUB_MODE: ${GITHUB_MODE:-live}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_MAX_FILES_PER_PR: ${GITHUB_MAX_FILES_PER_PR:-300}
      GITHUB_MAX_PATCH_BYTES: ${GITHUB_MAX_PATCH_BYTES:-120000}
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-4}
      ANALYSIS_JOB_ATTEMPTS: ${ANALYSIS_JOB_ATTEMPTS:-3}
      ANALYSIS_TIMEOUT_MS: ${ANALYSIS_TIMEOUT_MS:-120000}
      HIGH_RISK_NOTIFY_THRESHOLD: ${HIGH_RISK_NOTIFY_THRESHOLD:-70}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The API owns migrations; the worker waits for it so both are not racing
      # to apply the same migration.
      api:
        condition: service_started
    command: ["node", "dist/worker.js"]
    networks: [bugdna]

  # ---------------------------------------------------------------------------
  # Web — Next.js
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined at build time, so they must be
        # build args rather than only runtime environment.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-BugDNA}
    container_name: bugdna-web
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started
    networks: [bugdna]

volumes:
  postgres-data:
  redis-data:
  ml-models:

networks:
  bugdna:
    driver: bridge
