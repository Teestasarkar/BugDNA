name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      - name: Shipped model loads and matches the feature contract
        run: python -c "from riskradar.scoring import RiskModel; m = RiskModel(); print('trees', m.meta['trees'], 'threshold', round(m.threshold, 3))"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pr-risk-radar .
      - name: Container serves the API and the web app
        run: |
          docker run -d -p 8000:8000 --name rr pr-risk-radar
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs localhost:8000/api/health | grep -q '"ok"'
          curl -fs localhost:8000/ | grep -q '<div id="root">'
          curl -fs "localhost:8000/api/prs?limit=1" | grep -q '"total"'
