# =============================================================================
# BugDNA — production stack (AWS EC2 behind Nginx)
# =============================================================================
# Differences from the development stack, and why:
#
#   * **Images are pulled, not built.** CI builds and pushes to GHCR; the
#     instance pulls. A t3.micro cannot build a Next.js bundle without running
#     out of memory, and building on the box would also mean a failed build takes
#     the site down rather than just failing the pipeline.
#
#   * **Nothing is published except Nginx.** Postgres, Redis, the API, the web
#     app and the risk service all listen only on the internal Docker network.
#     Nginx on :80/:443 is the single ingress.
#
#   * **Resource limits are set.** On a small instance one runaway container
#     otherwise starves the rest; the limits below fit comfortably in 2GB.
#
#   * **Log rotation is configured.** The default json-file driver grows without
#     bound and will fill an 8GB root volume.
#
# Usage on the instance:
#     docker compose -f docker-compose.prod.yml --env-file .env pull
#     docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# See docs/DEPLOYMENT.md for the full runbook.
# =============================================================================

name: bugdna

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-bugdna}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      # Host directory for pg_dump output. See infra/ec2/backup.sh.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-bugdna}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [bugdna-internal]

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *default-restart
    logging: *default-logging
    # `noeviction` is deliberate: BullMQ job data must not be silently evicted
    # under memory pressure. Redis holds no source-of-truth data, but dropping a
    # queued job mid-flight would leave an analysis stuck in RUNNING.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits: { memory: 320M }
    networks: [bugdna-internal]

  # ---------------------------------------------------------------------------
  # Risk service — internal only, never proxied
  # ---------------------------------------------------------------------------
  ml-service:
    image: ${REGISTRY:-ghcr.io/teestasarkar}/bugdna-ml:${IMAGE_TAG:-latest}
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      ML_PORT: 8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?ML_SERVICE_TOKEN is required in production}
      MODEL_DIR: /app/models
      CONTRACTS_DIR: /app/contracts
      MODEL_NAME: ${MODEL_NAME:-bugdna-risk}
      MODEL_VERSION: ${MODEL_VERSION:-latest}
      ALLOW_HEURISTIC_FALLBACK: ${ALLOW_HEURISTIC_FALLBACK:-true}
      BOOTSTRAP_MODEL_ON_START: ${BOOTSTRAP_MODEL_ON_START:-true}
      BOOTSTRAP_ROWS: ${BOOTSTRAP_ROWS:-12000}
    volumes:
      # Survives redeploys, so the model is not retrained on every release.
      - ml-models:/app/models
    deploy:
      resources:
        # SHAP and XGBoost are the memory-hungriest part of the system.
        limits: { memory: 900M }
    networks: [bugdna-internal]

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  api:
    image: ${REGISTRY:-ghcr.io/teestasarkar}/bugdna-api:${IMAGE_TAG:-latest}
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_URL: ${APP_URL:?APP_URL is required}
      API_URL: ${API_URL:?API_URL is required}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bugdna}?schema=public&connection_limit=10
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}

      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # Behind Nginx, so X-Forwarded-For must be trusted for req.ip to be the
      # real client — the rate limiter keys on it.
      TRUST_PROXY: "true"

      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required in production}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required in production}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_NAME: ${COOKIE_NAME:-bugdna_session}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      GITHUB_MODE: ${GITHUB_MODE:-live}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:?GITHUB_CALLBACK_URL is required}
      GITHUB_OAUTH_SCOPES: ${GITHUB_OAUTH_SCOPES:-read:user,user:email,repo}

      HIGH_RISK_NOTIFY_THRESHOLD: ${HIGH_RISK_NOTIFY_THRESHOLD:-70}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-true}
      APP_VERSION: ${IMAGE_TAG:-latest}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml-service: { condition: service_started }
    # The API applies migrations. Exactly one service must, or two replicas race.
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [bugdna-internal]

  # ---------------------------------------------------------------------------
  # Worker
  # ---------------------------------------------------------------------------
  worker:
    image: ${REGISTRY:-ghcr.io/teestasarkar}/bugdna-api:${IMAGE_TAG:-latest}
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bugdna}?schema=public&connection_limit=5
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      APP_URL: ${APP_URL}
      API_URL: ${API_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      GITHUB_MODE: ${GITHUB_MODE:-live}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      # Lower than development: on a small instance, four concurrent analyses
      # each holding a diff in memory is the main OOM risk.
      ANALYSIS_CONCURRENCY: ${ANALYSIS_CONCURRENCY:-2}
      ANALYSIS_JOB_ATTEMPTS: ${ANALYSIS_JOB_ATTEMPTS:-3}
      ANALYSIS_TIMEOUT_MS: ${ANALYSIS_TIMEOUT_MS:-120000}
      HIGH_RISK_NOTIFY_THRESHOLD: ${HIGH_RISK_NOTIFY_THRESHOLD:-70}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_started }
    command: ["node", "dist/worker.js"]
    deploy:
      resources:
        limits: { memory: 512M }
    networks: [bugdna-internal]

  # ---------------------------------------------------------------------------
  # Web
  # ---------------------------------------------------------------------------
  web:
    image: ${REGISTRY:-ghcr.io/teestasarkar}/bugdna-web:${IMAGE_TAG:-latest}
    <<: *default-restart
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3000
      # Also present at build time (baked into the client bundle); set here for
      # the server-rendered half.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
    depends_on:
      api: { condition: service_started }
    deploy:
      resources:
        limits: { memory: 384M }
    networks: [bugdna-internal]

  # ---------------------------------------------------------------------------
  # Nginx — the only public ingress
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    <<: *default-restart
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # The official nginx image runs envsubst over /etc/nginx/templates/*.template
      # and writes the result into /etc/nginx/conf.d/ at container start.
      - ./infra/nginx/conf.d:/etc/nginx/templates:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
      # certbot's webroot challenge directory
      - certbot-webroot:/var/www/certbot:ro
    environment:
      # The nginx image substitutes ${...} in /etc/nginx/templates/*.conf and
      # writes the result to /etc/nginx/conf.d/. This is how the server name
      # reaches the config without baking it into the repo.
      BUGDNA_SERVER_NAME: ${BUGDNA_SERVER_NAME:-_}
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128M }
    networks: [bugdna-internal, bugdna-public]

volumes:
  postgres-data:
  redis-data:
  ml-models:
  nginx-cache:
  nginx-logs:
  certbot-webroot:

networks:
  # Services talk to each other here. `internal: true` would also block egress,
  # which the API needs for api.github.com — so it stays a normal bridge and
  # isolation comes from not publishing ports.
  bugdna-internal:
    driver: bridge
  bugdna-public:
    driver: bridge
