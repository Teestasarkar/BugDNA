# =============================================================================
# BugDNA — Nginx main configuration
# =============================================================================
# Wraps the site config in conf.d/. Kept separate so the site config can be
# edited (or rewritten by certbot) without touching worker/event tuning.

user  nginx;
# One worker per core.
worker_processes  auto;

# Raised from the default 1024: each websocket connection watching an analysis
# holds a file descriptor for as long as the user has the page open.
worker_rlimit_nofile 20000;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- connection handling ------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout   65;
    keepalive_requests  1000;

    # Trust the container DNS for upstream resolution, so a restarted service
    # gets picked up without an Nginx reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- buffers ------------------------------------------------------------
    client_body_buffer_size    128k;
    client_header_buffer_size  4k;
    large_client_header_buffers 4 16k;

    proxy_buffer_size          8k;
    proxy_buffers              8 8k;
    proxy_busy_buffers_size    16k;

    # --- logging ------------------------------------------------------------
    access_log  /var/log/nginx/access.log;

    server_tokens off;

    # Drop requests with an unrecognised Host before they reach a backend.
    # Prevents host-header confusion and cuts scanner noise from the logs.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;  # close the connection without a response
    }

    include /etc/nginx/conf.d/*.conf;
}
