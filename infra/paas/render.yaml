# =============================================================================
# BugDNA on Render — FREE TIER
# =============================================================================
# Import as a Blueprint: Render -> New -> Blueprint -> point at this repo.
#
# Render's free tier gives away **web services** and a **Key Value (Redis)**
# instance. Private services (`pserv`) and background workers are paid products.
# So this file deviates from the production architecture in exactly two
# documented ways:
#
#   1. The analysis worker runs INSIDE the API process (RUN_WORKER_IN_API=true)
#      instead of as its own dyno. Trade: a wedged analysis can affect API
#      latency, and the two cannot scale independently.
#
#   2. The risk service is a `web` service rather than `pserv`, so it gets a
#      public URL. It is still protected by ML_SERVICE_TOKEN — the shared secret
#      is checked on every scoring call, in constant time — but it is no longer
#      network-isolated. Set a strong token.
#
# For the real production topology (separate worker, network-isolated risk
# service, Nginx ingress) use docker-compose.prod.yml on EC2. See
# docs/DEPLOYMENT.md.
#
# Also note: free services SLEEP after ~15 minutes idle. The first request then
# takes 30-50s while the container cold-starts. Warm both URLs before a demo.

services:
  # ---------------------------------------------------------------------------
  # Redis — cache, transient analysis state, BullMQ
  # ---------------------------------------------------------------------------
  # `noeviction` is not a preference, it is a requirement: BullMQ stores job
  # state in Redis keys, and an eviction policy that discards them silently
  # loses queued analyses. Render's free plan is 25 MB with no persistence
  # across restarts — acceptable here *only* because Redis is never the source
  # of truth in this system. A flushed Redis costs a cold cache and any
  # in-flight job, both of which are recoverable from Postgres.
  #
  # An empty ipAllowList means no public access at all: reachable only from the
  # other services in this blueprint.
  - type: redis
    name: bugdna-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ---------------------------------------------------------------------------
  # Risk service — XGBoost + SHAP
  # ---------------------------------------------------------------------------
  - type: web
    name: bugdna-ml
    runtime: docker
    plan: free
    region: singapore          # match your Neon/Upstash region
    # Root context: the image needs contracts/feature-spec.json.
    dockerContext: .
    dockerfilePath: ./ml-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info
      # No port wiring needed: Render injects PORT, and both images resolve
      # PORT -> ML_PORT/API_PORT -> default at start time.
      - key: MODEL_DIR
        value: /app/models
      - key: CONTRACTS_DIR
        value: /app/contracts
      # Trains a bootstrap model on first boot so predictions come from real
      # XGBoost inference with real SHAP rather than the heuristic fallback.
      # Kept small because the free tier has 512 MB and a boot time limit.
      - key: BOOTSTRAP_MODEL_ON_START
        value: "true"
      - key: BOOTSTRAP_ROWS
        value: "6000"
      - key: ALLOW_HEURISTIC_FALLBACK
        value: "true"
      # REQUIRED: this service is publicly routable on the free tier.
      - key: ML_SERVICE_TOKEN
        sync: false

  # ---------------------------------------------------------------------------
  # API + worker (collapsed — see the header)
  # ---------------------------------------------------------------------------
  - type: web
    name: bugdna-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /healthz
    # No dockerCommand. Render word-splits it and execs without a shell, so `&&`
    # is not an operator there — it arrives as an argument to prisma. Migrations
    # run in the image's entrypoint instead, gated by RUN_MIGRATIONS_ON_START
    # below, which also keeps SIGTERM reaching the graceful shutdown.
    envVars:
      # Exactly one service may apply migrations; two would race.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: NODE_ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: info

      # Render terminates TLS and sits in front of the app.
      - key: TRUST_PROXY
        value: "true"
      # The frontend is on a different site (Vercel), so the session cookie
      # needs SameSite=None — which mandates Secure.
      - key: COOKIE_SECURE
        value: "true"

      # --- the free-tier compromise ---
      - key: RUN_WORKER_IN_API
        value: "true"
      # Keep this low: one dyno now serves HTTP and runs analyses, and each
      # in-flight analysis holds a diff in memory.
      - key: ANALYSIS_CONCURRENCY
        value: "1"

      # --- external datastores ---
      # Neon: strip `channel_binding=require` — Prisma's driver does not
      # negotiate SCRAM channel binding and will fail to connect. Keep the
      # -pooler host and connection_limit low; Neon's free tier caps connections.
      - key: DATABASE_URL
        sync: false
      # Wired from the Key Value service above. To use an external provider
      # (Upstash, ElastiCache) instead, delete this block and the `redis`
      # service, then set REDIS_URL manually to the provider's rediss:// URL —
      # the TLS one, not a REST endpoint; ioredis speaks the wire protocol.
      - key: REDIS_URL
        fromService:
          name: bugdna-redis
          type: redis
          property: connectionString

      # --- secrets ---
      - key: SESSION_SECRET
        generateValue: true
      # MUST be exactly 64 hex characters: openssl rand -hex 32
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Must match bugdna-ml exactly.
      - key: ML_SERVICE_TOKEN
        sync: false

      # --- wiring ---
      # These three are set by hand rather than with `fromService`, and the
      # reason is not laziness: `fromService` can only yield a bare hostname
      # (`bugdna-ml.onrender.com`), while the backend validates each of these as
      # a full URL and refuses to boot without a scheme. Render offers no string
      # interpolation, so there is no way to prepend `https://` in this file.
      #
      # Set after the first deploy, when Render has assigned the subdomains:
      #   ML_SERVICE_URL  https://bugdna-ml.onrender.com
      #   API_URL         https://bugdna-api.onrender.com
      #   APP_URL         https://<your-project>.vercel.app
      #   CORS_ORIGINS    https://<your-project>.vercel.app
      #
      # CORS_ORIGINS is an exact-match allowlist, so it must carry the scheme
      # and no trailing slash — a browser Origin header has neither a path nor a
      # trailing slash, and the comparison is literal.
      - key: ML_SERVICE_URL
        sync: false
      - key: API_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # --- GitHub ---
      # `mock` runs the entire workflow on deterministic fixtures with no
      # credentials. Switch to `live` once an OAuth App exists.
      - key: GITHUB_MODE
        value: mock
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false

      - key: ENABLE_DEMO_LOGIN
        value: "true"
      - key: HIGH_RISK_NOTIFY_THRESHOLD
        value: "70"
      - key: SEED_DEMO_LOGIN
        value: bugdna-demo
